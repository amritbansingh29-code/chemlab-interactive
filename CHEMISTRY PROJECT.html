s:[`Positive (+1)`,`Negative (-1)`,`Neutral (0)`,`Variable`],answerIndex:2,explanation:`Neutrons are subatomic particles located in the atomic nucleus that carry no electrical charge (they are electrically neutral).`},{id:7,category:`Periodic Table`,difficulty:`Easy`,question:`What is the common group name for elements in Group 18 of the periodic table?`,options:[`Alkali Metals`,`Halogens`,`Noble Gases`,`Lanthanides`],answerIndex:2,explanation:`Group 18 elements are called Noble Gases. They possess completely filled outer valence electron shells, making them highly stable and chemically inert.`},{id:8,category:`Acids & Bases`,difficulty:`Medium`,question:`Which acid is primary constituent of car batteries?`,options:[`Hydrochloric Acid`,`Nitric Acid`,`Sulfuric Acid`,`Phosphoric Acid`],answerIndex:2,explanation:`Lead-acid car batteries use Sulfuric Acid (H₂SO₄) diluted with water as the electrolyte to conduct electricity during chemical discharge cycles.`},{id:9,category:`General Chemistry`,difficulty:`Easy`,question:`Which gas constitutes approximately 78% of Earth's atmosphere?`,options:[`Oxygen`,`Carbon Dioxide`,`Nitrogen`,`Argon`],answerIndex:2,explanation:`Nitrogen gas (N₂) is the most abundant gas in Earth's atmosphere, accounting for roughly 78.08%, while Oxygen makes up about 20.95%.`},{id:10,category:`General Chemistry`,difficulty:`Easy`,question:`What is the common name for solid Carbon Dioxide?`,options:[`Dry Ice`,`Liquid Nitrogen`,`Slush Ice`,`Quartz`],answerIndex:0,explanation:`Solid carbon dioxide is called 'Dry Ice' because it undergoes sublimation—converting directly from a solid to a gas without melting into liquid.`},{id:11,category:`Atomic Structure`,difficulty:`Medium`,question:`Which subatomic particle was discovered by J.J. Thomson in 1897 using cathode ray tubes?`,options:[`Proton`,`Neutron`,`Electron`,`Quark`],answerIndex:2,explanation:`J.J. Thomson discovered the electron, showing that atoms contain small, negatively charged fundamental particles, which disproved the indivisible atom theory.`},{id:12,category:`General Chemistry`,difficulty:`Easy`,question:`What is the chemical formula for common table salt?`,options:[`NaCO₃`,`HCl`,`NaCl`,`NaOH`],answerIndex:2,explanation:`Table salt is Sodium Chloride, represented by the chemical formula NaCl. It is an ionic lattice comprised of equal parts sodium and chlorine ions.`},{id:13,category:`Acids & Bases`,difficulty:`Easy`,question:`What is the pH of chemically pure water at standard room temperature?`,options:[`1`,`5`,`7`,`14`],answerIndex:2,explanation:`Pure water is neutral on the pH scale, having a pH of exactly 7.0 at 25°C because the concentration of hydronium and hydroxide ions is perfectly balanced.`},{id:14,category:`Chemical Reactions`,difficulty:`Easy`,question:`What substance increases the rate of a chemical reaction without being consumed in the process?`,options:[`Reactant`,`Solvent`,`Catalyst`,`Inhibitor`],answerIndex:2,explanation:`A catalyst speeds up a reaction by providing an alternative reaction pathway with a lower activation energy, remaining completely unchanged at the end.`},{id:15,category:`Periodic Table`,difficulty:`Medium`,question:`Which is the lightest and most highly reactive halogen element?`,options:[`Chlorine`,`Fluorine`,`Bromine`,`Astatine`],answerIndex:1,explanation:`Fluorine (F) is the first element in Group 17 (Halogens). It is a pale yellow gas and is the most chemically reactive and electronegative element in existence.`},{id:16,category:`Chemical Bonding`,difficulty:`Easy`,question:`What type of chemical bond is formed when two atoms share a pair of electrons?`,options:[`Ionic Bond`,`Covalent Bond`,`Metallic Bond`,`Hydrogen Bond`],answerIndex:1,explanation:`A covalent bond consists of the mutual sharing of one or more pairs of electrons between two non-metallic atoms to achieve stable noble gas configurations.`},{id:17,category:`Chemical Bonding`,difficulty:`Easy`,question:`What type of bond is formed by the electrostatic attraction between oppositely charged ions?`,options:[`Covalent Bond`,`Ionic Bond`,`Coordinate Bond`,`Metallic Bond`],answerIndex:1,explanation:`An ionic bond forms when one or more electrons are completely transferred from a metal atom (forming a cation) to a non-metal atom (forming an anion).`},{id:18,category:`Atomic Structure`,difficulty:`Easy`,question:`How many valence electrons does a neutral Carbon atom possess?`,options:[`2`,`4`,`6`,`8`],answerIndex:1,explanation:`Carbon has the atomic number 6, with an electron configuration of 1s² 2s² 2p². The outer shell (n=2) contains 4 valence electrons, allowing it to form 4 covalent bonds.`},{id:19,category:`General Chemistry`,difficulty:`Medium`,question:`What is the chemical formula of Ozone?`,options:[`O₂`,`O₃`,`CO₂`,`H₂O`],answerIndex:1,explanation:`Ozone is a triatomic allotrope of oxygen, consisting of three oxygen atoms bonded together, represented chemically as O₃.`},{id:20,category:`Periodic Table`,difficulty:`Easy`,question:`Which synthetic element was named to honor the legendary physicist Albert Einstein?`,options:[`Fermium`,`Nobelium`,`Einsteinium`,`Mendelevium`],answerIndex:2,explanation:`Einsteinium (Es, atomic number 99) is a highly radioactive transuranic synthetic element discovered in the debris of the first thermonuclear bomb explosion in 1952.`},{id:21,category:`General Chemistry`,difficulty:`Easy`,question:`What is the primary gaseous component of natural gas?`,options:[`Ethane`,`Propane`,`Methane`,`Butane`],answerIndex:2,explanation:`Methane (CH₄), a simple single-carbon alkane, makes up approximately 70% to 90% of the hydrocarbon mixture found in natural gas.`},{id:22,category:`Acids & Bases`,difficulty:`Medium`,question:`Which of the following pH values indicates a highly acidic solution?`,options:[`pH 1`,`pH 6`,`pH 8`,`pH 13`],answerIndex:0,explanation:`The pH scale ranges from 0 to 14. Lower numbers represent higher acidity. A pH of 1 is highly acidic, whereas a pH of 13 represents a strong base.`},{id:23,category:`Chemical Reactions`,difficulty:`Medium`,question:`Which gas is released when a reactive metal like Zinc reacts with Hydrochloric Acid?`,options:[`Oxygen`,`Chlorine`,`Hydrogen`,`Carbon Dioxide`],answerIndex:2,explanation:`This single displacement reaction (Zn + 2HCl → ZnCl₂ + H₂) yields zinc chloride salt and releases highly flammable Hydrogen gas (H₂).`},{id:24,category:`Lab Safety`,difficulty:`Easy`,question:`If a corrosive chemical splashes into your eyes, how long should you rinse them at the eyewash station?`,options:[`1-2 minutes`,`At least 15 minutes`,`5 minutes`,`Rinsing is not recommended`],answerIndex:1,explanation:`Safety protocols dictate flushing eyes with clean, running water at an eyewash station for at least 15-20 minutes to thoroughly dilute and clear out corrosive chemicals.`},{id:25,category:`Chemical Reactions`,difficulty:`Medium`,question:`In a flame test, what color indicates the presence of Copper ions (Cu²⁺)?`,options:[`Bright Crimson Red`,`Greenish-Blue`,`Lilac/Violet`,`Golden Yellow`],answerIndex:1,explanation:`Copper ions impart a distinctive bright greenish-blue hue to a burner flame due to electron excitation and subsequent photon emissions at specific wavelengths.`},{id:26,category:`Stoichiometry`,difficulty:`Medium`,question:`What is the standard SI unit for measuring the amount of a chemical substance?`,options:[`Gram`,`Mole`,`Liter`,`Pascal`],answerIndex:1,explanation:`The Mole (mol) is the SI base unit representing the quantity of a substance containing exactly 6.02214076 × 10²³ elementary entities (Avogadro's number).`},{id:27,category:`Stoichiometry`,difficulty:`Medium`,question:`What is the approximate numerical value of Avogadro's constant?`,options:[`3.00 × 10⁸`,`6.02 × 10²³`,`1.60 × 10⁻¹⁹`,`9.81`],answerIndex:1,explanation:`Avogadro's constant is 6.022 × 10²³ molecules, atoms, or particles per mole, representing the ratio of particles to the amount of substance.`},{id:28,category:`Periodic Table`,difficulty:`Easy`,question:`Which metallic element is represented by the chemical symbol 'K'?`,options:[`Krypton`,`Potassium`,`Cobalt`,`Calcium`],answerIndex:1,explanation:`Potassium is represented by the letter 'K', derived from its Neo-Latin name 'Kalium', which refers to alkali substances extracted from plant ashes.`},{id:29,category:`Atomic Structure`,difficulty:`Easy`,question:`Which subatomic particles reside inside the central nucleus of an atom?`,options:[`Protons and Electrons`,`Electrons and Neutrons`,`Protons and Neutrons`,`Only Protons`],answerIndex:2,explanation:`The dense atomic nucleus houses nucleons, which consist of positively charged Protons and uncharged Neutrons, while electrons orbit in shells surrounding it.`},{id:30,category:`General Chemistry`,difficulty:`Medium`,question:`What is the term for a substance converting directly from the solid phase to the gas phase?`,options:[`Evaporation`,`Condensation`,`Sublimation`,`Deposition`],answerIndex:2,explanation:`Sublimation is the endothermic phase transition of a substance directly from solid to gas, bypassing the intermediate liquid state (e.g., dry ice, iodine).`},{id:31,category:`Periodic Table`,difficulty:`Hard`,question:`Which chemical element possesses the absolute highest electronegativity value on the Pauling scale?`,options:[`Oxygen`,`Chlorine`,`Fluorine`,`Nitrogen`],answerIndex:2,explanation:`Fluorine has the highest electronegativity of all elements, valued at 3.98 on the Pauling scale, indicating an extreme tendency to attract bonding electrons.`},{id:32,category:`General Chemistry`,difficulty:`Medium`,question:`What is the primary chemical compound found in ordinary silica glass?`,options:[`Sodium Carbonate`,`Silicon Dioxide`,`Calcium Silicate`,`Aluminium Oxide`],answerIndex:1,explanation:`Ordinary glass is made by melting sand, which is primarily composed of Silicon Dioxide (SiO₂), also known as silica.`},{id:33,category:`Chemical Reactions`,difficulty:`Easy`,question:`Which colorless gas burns in air with a characteristic loud squeaky 'pop' sound during a laboratory splint test?`,options:[`Oxygen`,`Hydrogen`,`Carbon Dioxide`,`Helium`],answerIndex:1,explanation:`Hydrogen gas is highly flammable. When a glowing splint is inserted into a tube containing hydrogen mixed with oxygen, it ignites rapidly, producing a distinct 'pop'.`},{id:34,category:`Chemical Reactions`,difficulty:`Easy`,question:`What term describes a chemical reaction that releases thermal energy (heat) into its surroundings?`,options:[`Endothermic`,`Exothermic`,`Isothermal`,`Catalytic`],answerIndex:1,explanation:`An exothermic reaction releases energy (usually heat or light) to the surroundings because the energy released during bond formation exceeds the energy needed for bond breaking.`},{id:35,category:`Acids & Bases`,difficulty:`Easy`,question:`Which weak organic acid gives household vinegar its characteristic sour taste and sharp odor?`,options:[`Citric Acid`,`Formic Acid`,`Acetic Acid`,`Lactic Acid`],answerIndex:2,explanation:`Vinegar is an aqueous solution containing approximately 5-8% Acetic Acid (CH₃COOH), a simple carboxylic acid produced by bacterial fermentation of ethanol.`},{id:36,category:`Acids & Bases`,difficulty:`Easy`,question:`Which strong base is commonly known as caustic soda and used extensively in soap manufacturing?`,options:[`Calcium Hydroxide`,`Sodium Hydroxide`,`Ammonium Hydroxide`,`Potassium Carbonate`],answerIndex:1,explanation:`Sodium Hydroxide (NaOH) is a highly corrosive alkali known as caustic soda or lye. It reacts with fats and oils in a process called saponification to produce soap.`},{id:37,category:`Periodic Table`,difficulty:`Easy`,question:`What is the chemical symbol for the heavy metal element Lead?`,options:[`Le`,`Ld`,`Pb`,`Li`],answerIndex:2,explanation:`The chemical symbol for lead is 'Pb', representing the Latin word 'plumbum', which is also the root for modern words like 'plumbing'.`},{id:38,category:`General Chemistry`,difficulty:`Medium`,question:`Which crystalline allotrope of Carbon conducts electricity despite being a non-metal?`,options:[`Diamond`,`Graphite`,`Buckminsterfullerene`,`Amorphous Carbon`],answerIndex:1,explanation:`Graphite has a layered structure where carbon atoms are sp² hybridized. This leaves one delocalized electron per carbon atom free to drift, conducting electricity.`},{id:39,category:`Periodic Table`,difficulty:`Easy`,question:`Which Russian chemist is widely credited with publishing the first recognizable Periodic Table of Elements in 1869?`,options:[`Antoine Lavoisier`,`Dmitri Mendeleev`,`John Dalton`,`Marie Curie`],answerIndex:1,explanation:`Dmitri Mendeleev formulated the Periodic Law and created the first periodic table, organizing elements by atomic mass and leaving gaps to accurately predict undiscovered elements.`},{id:40,category:`Acids & Bases`,difficulty:`Easy`,question:`What happens when blue litmus indicator paper is dipped into an acidic solution?`,options:[`It remains blue`,`It turns bright red`,`It turns green`,`It turns completely black`],answerIndex:1,explanation:`Litmus is a water-soluble dye extracted from lichens. Under acidic conditions (pH < 4.5), the indicator molecules undergo protonation, shifting their color to red.`},{id:41,category:`General Chemistry`,difficulty:`Easy`,question:`What element is the primary material used in modern pencil leads?`,options:[`Lead`,`Graphite (Carbon)`,`Silicon`,`Charcoal`],answerIndex:1,explanation:`Pencil leads do not contain lead. They are made from a blended mixture of Graphite (a soft allotrope of carbon) and clay, which leaves a dark gray residue on paper.`},{id:42,category:`Chemical Reactions`,difficulty:`Medium`,question:`Which gas turns clear limewater [aqueous Calcium Hydroxide] milky/cloudy upon bubbling through it?`,options:[`Oxygen`,`Nitrogen`,`Carbon Dioxide`,`Carbon Monoxide`],answerIndex:2,explanation:`Carbon dioxide reacts with limewater to form insoluble Calcium Carbonate (CaCO₃) precipitate particles, creating a milky white suspension: Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O.`},{id:43,category:`General Chemistry`,difficulty:`Medium`,question:`What is the typical physical color of Chlorine gas under standard conditions?`,options:[`Colorless`,`Deep Blue`,`Pale Yellow-Green`,`Dark Violet`],answerIndex:2,explanation:`Chlorine gas (Cl₂) is a diatomic gas characterized by a distinctive, suffocating odor and a pale, yellowish-green color.`},{id:44,category:`General Chemistry`,difficulty:`Medium`,question:`Brass is a classic metallic alloy comprised primarily of which two elements?`,options:[`Copper and Tin`,`Iron and Carbon`,`Copper and Zinc`,`Silver and Gold`],answerIndex:2,explanation:`Brass is an alloy consisting of Copper (Cu) fused with Zinc (Zn), whereas Bronze is typically an alloy of Copper blended with Tin (Sn).`},{id:45,category:`Lab Safety`,difficulty:`Medium`,question:`When diluting a highly concentrated acid in a laboratory, what is the correct and safe method for mixing?`,options:[`Pour water quickly into the acid`,`Pour acid slowly into water`,`Pour both simultaneously`,`Mix in a sealed vacuum container`],answerIndex:1,explanation:`Always add acid slowly to water (remember 'A&W'). Diluting concentrated acid is highly exothermic. Adding water to acid can cause the mixture to flash boil and violently splash corrosive acid out.`},{id:46,category:`Acids & Bases`,difficulty:`Easy`,question:`What color change occurs when red litmus paper is exposed to an alkaline (basic) solution?`,options:[`It turns white`,`It turns green`,`It turns dark blue`,`It remains red`],answerIndex:2,explanation:`Basic or alkaline substances (pH > 8.3) deprotonate the litmus dye structure, causing it to return to its conjugate base form, which appears deep blue.`},{id:47,category:`Atomic Structure`,difficulty:`Hard`,question:`What is the net electrical charge of an alpha particle?`,options:[`-1`,`0`,`+1`,`+2`],answerIndex:3,explanation:`An alpha particle (α) is identical to a Helium-4 nucleus, containing 2 protons and 2 neutrons with no orbiting electrons, resulting in a net positive charge of +2.`},{id:48,category:`Chemical Bonding`,difficulty:`Hard`,question:`Which of the following compounds exhibits a giant covalent network structure, giving it an extremely high melting point?`,options:[`Water (H₂O)`,`Silicon Dioxide (SiO₂)`,`Sodium Chloride (NaCl)`,`Carbon Dioxide (CO₂)`],answerIndex:1,explanation:`Silicon Dioxide (Quartz) forms a giant three-dimensional covalent lattice similar to diamond, where every silicon atom is covalently bonded to four oxygen atoms.`},{id:49,category:`Chemical Reactions`,difficulty:`Medium`,question:`What metal catalyst is traditionally employed in the industrial Haber-Bosch process to synthesize ammonia?`,options:[`Platinum`,`Nickel`,`Iron`,`Copper`],answerIndex:2,explanation:`The industrial synthesis of Ammonia (N₂ + 3H₂ ⇌ 2NH₃) utilizes a finely divided porous Iron catalyst promoted with potassium and aluminum oxides to run at moderate temperatures.`},{id:50,category:`Periodic Table`,difficulty:`Hard`,question:`Which of the following halogens has the largest atomic radius and lowest reactivity?`,options:[`Fluorine`,`Chlorine`,`Bromine`,`Iodine`],answerIndex:3,explanation:`Reactivity in Group 17 (Halogens) decreases down the group. Iodine (I) is lower down than F, Cl, and Br, meaning its valence electrons are further from the nucleus and it attracts electrons less strongly.`},{id:51,category:`Organic Chemistry`,difficulty:`Hard`,question:`Which of the following describes the stereochemical outcome of an SN2 reaction on a chiral carbon?`,options:[`Complete racemization`,`Walden inversion of configuration`,`Retention of configuration`,`Formation of a meso compound`],answerIndex:1,explanation:`An SN2 reaction proceeds via backside attack of the nucleophile on the electrophilic carbon. As the transition state resolves, this concerted mechanism causes a complete inversion of configuration, known as Walden inversion.`},{id:52,category:`Atomic Structure`,difficulty:`Medium`,question:`What is the maximum number of electrons that can occupy the 3d subshell?`,options:[`2`,`6`,`10`,`14`],answerIndex:2,explanation:`The 'd' subshell has angular momentum quantum number l = 2, which allows 5 orbitals (ml = -2, -1, 0, +1, +2). Each orbital holds up to 2 electrons, allowing a maximum of 10 electrons in the 3d subshell.`},{id:53,category:`Acids & Bases`,difficulty:`Medium`,question:`According to the Lewis definition, what constitutes a base?`,options:[`A proton donor`,`A proton acceptor`,`An electron pair donor`,`An electron pair acceptor`],answerIndex:2,explanation:`A Lewis base is any species that can donate a pair of electrons to form a covalent bond. A Lewis acid, conversely, is an electron-pair acceptor.`},{id:54,category:`General Chemistry`,difficulty:`Easy`,question:`What is the main component of natural gas?`,options:[`Ethane`,`Propane`,`Butane`,`Methane`],answerIndex:3,explanation:`Methane (CH₄) is the simplest alkane hydrocarbon and is the primary constituent of natural gas, typically making up between 70% to 90% of its volume.`},{id:55,category:`Periodic Table`,difficulty:`Hard`,question:`Which of the following elements has the highest first ionization energy?`,options:[`Oxygen`,`Fluorine`,`Nitrogen`,`Neon`],answerIndex:3,explanation:`Neon (Ne) is a noble gas with a completely filled valence electron shell (2s²2p⁶). Because of this highly stable closed-shell configuration and relatively high effective nuclear charge, it is extremely difficult to remove an electron, giving it the highest first ionization energy among the options.`},{id:56,category:`Chemical Bonding`,difficulty:`Medium`,question:`What is the hybridization of the carbon atom in carbon dioxide (CO₂)?`,options:[`sp`,`sp2`,`sp3`,`sp3d`],answerIndex:0,explanation:`In carbon dioxide (O=C=O), the carbon atom forms two double bonds (two sigma bonds and two pi bonds) and has zero lone pairs. This yields a steric number of 2, requiring sp hybridization and resulting in a linear molecular shape.`},{id:57,category:`Gases & Solutions`,difficulty:`Hard`,question:`Which gas will effuse the fastest under identical conditions of temperature and pressure?`,options:[`Oxygen (O₂)`,`Nitrogen (N₂)`,`Helium (He)`,`Carbon Dioxide (CO₂)`],answerIndex:2,explanation:`According to Graham's Law of Effusion, the rate of effusion of a gas is inversely proportional to the square root of its molar mass. Helium (He) has the lowest molar mass (4 g/mol) among the options, meaning it will effuse the fastest.`},{id:58,category:`Lab Safety`,difficulty:`Easy`,question:`What is the first step you should take if a chemical splashes into your eyes in the lab?`,options:[`Wipe your eyes with a paper towel`,`Flush your eyes immediately with water for 15-20 minutes`,`Apply eye drops to soothe irritation`,`Find the lab instructor to ask what to do`],answerIndex:1,explanation:`If any chemical splashes into the eyes, you must immediately flush them with copious amounts of running water using the eyewash station for at least 15 to 20 minutes to dilute and remove the chemical before seeking medical attention.`},{id:59,category:`Chemical Reactions`,difficulty:`Medium`,question:`In the single displacement reaction Zn + 2HCl -> ZnCl₂ + H₂, which species is being oxidized?`,options:[`Zinc (Zn)`,`Hydrogen ion (H+)`,`Chloride ion (Cl-)`,`Zinc ion (Zn2+)`],answerIndex:0,explanation:`Zinc (Zn) starts in its elemental form with an oxidation state of 0 and ends in ZnCl₂ with an oxidation state of +2. Losing electrons represents oxidation (OIL), so elemental Zinc is oxidized.`},{id:60,category:`General Chemistry`,difficulty:`Easy`,question:`What is the standard value of atmospheric pressure at sea level in millimeters of mercury (mmHg)?`,options:[`100 mmHg`,`760 mmHg`,`1000 mmHg`,`14.7 mmHg`],answerIndex:1,explanation:`Standard atmospheric pressure (1 atm) is defined as exactly 760 mmHg (torr) at sea level, which represents the height of a mercury column supported by atmospheric pressure.`},{id:61,category:`Atomic Structure`,difficulty:`Medium`,question:`Which quantum number determines the orientation of an orbital in space?`,options:[`Principal quantum number (n)`,`Angular momentum quantum number (l)`,`Magnetic quantum number (ml)`,`Spin quantum number (ms)`],answerIndex:2,explanation:`The magnetic quantum number (ml) specifies the orientation of the orbital in space. Its values are integers ranging from -l to +l, defining the number of degenerate orbitals in a subshell.`},{id:62,category:`Periodic Table`,difficulty:`Easy`,question:`What is the common group name of Group 17 elements in the periodic table?`,options:[`Alkali Metals`,`Alkaline Earth Metals`,`Halogens`,`Noble Gases`],answerIndex:2,explanation:`Group 17 elements are known as the Halogens. They are highly reactive nonmetals that form salts when reacted with metals (from the Greek roots 'halo-' meaning salt and '-gen' meaning producing).`},{id:63,category:`Chemical Bonding`,difficulty:`Medium`,question:`What type of intermolecular force is primarily responsible for the high boiling point of water?`,options:[`London dispersion forces`,`Dipole-dipole interactions`,`Hydrogen bonding`,`Ionic bonding`],answerIndex:2,explanation:`Hydrogen bonding, a strong type of dipole-dipole attraction that occurs between Hydrogen bonded to highly electronegative elements (N, O, F) and a neighboring electronegative atom's lone pair, holds water molecules together tightly, resulting in an anomalously high boiling point of 100°C.`},{id:64,category:`General Chemistry`,difficulty:`Easy`,question:`Which of the following processes is a physical change rather than a chemical reaction?`,options:[`Baking a cake`,`Burning paper`,`Melting an ice cube`,`Rusting of an iron nail`],answerIndex:2,explanation:`Melting an ice cube is a physical change because it is only a phase change from solid water to liquid water. The chemical identity of the water molecules (H₂O) remains unchanged.`},{id:65,category:`Acids & Bases`,difficulty:`Hard`,question:`What is the pH of a 1.0 x 10^-3 M aqueous solution of a strong acid like HCl?`,options:[`3.0`,`7.0`,`11.0`,`1.0`],answerIndex:0,explanation:`HCl is a strong acid that dissociates completely in water. Thus, [H+] = 1.0 x 10^-3 M. pH is calculated as -log[H+], which equals -log(10^-3) = 3.0.`},{id:66,category:`Chemical Reactions`,difficulty:`Hard`,question:`Which of the following chemical equations represents a classic double displacement reaction?`,options:[`2H₂ + O₂ -> 2H₂O`,`AgNO₃ + NaCl -> AgCl + NaNO₃`,`CaCO₃ -> CaO + CO₂`,`Zn + CuSO₄ -> ZnSO₄ + Cu`],answerIndex:1,explanation:`AgNO₃ (aq) + NaCl (aq) -> AgCl (s) + NaNO₃ (aq) is a double displacement reaction. The cations and anions exchange partners, and silver chloride precipitates out as an insoluble solid.`},{id:67,category:`Lab Safety`,difficulty:`Easy`,question:`When using a fire extinguisher, what does the safety acronym PASS stand for?`,options:[`Pull, Aim, Squeeze, Sweep`,`Push, Activate, Spray, Sweep`,`Pull, Arm, Spray, Squeeze`,`Press, Aim, Squeeze, Shake`],answerIndex:0,explanation:`PASS is the standard sequence for operating a fire extinguisher: Pull the pin, Aim the nozzle at the base of the fire, Squeeze the trigger, and Sweep side-to-side.`},{id:68,category:`Gases & Solutions`,difficulty:`Medium`,question:`What defines a solution that contains the maximum concentration of dissolved solute at a specific temperature?`,options:[`Unsaturated`,`Saturated`,`Supersaturated`,`Concentrated`],answerIndex:1,explanation:`A saturated solution is one in which the dynamic rate of dissolution equals the rate of crystallization, meaning it holds the absolute maximum amount of dissolved solute possible under standard equilibrium at that temperature.`},{id:69,category:`Organic Chemistry`,difficulty:`Hard`,question:`Which of the following cyclic compounds is classified as an aromatic hydrocarbon, satisfying Hückel's Rule?`,options:[`Cyclohexane`,`Benzene`,`Hexane`,`Acetylene`],answerIndex:1,explanation:`Benzene (C₆H₆) is the quintessential aromatic hydrocarbon. It is cyclic, planar, fully conjugated, and has 6 pi electrons, which perfectly matches Hückel's (4n+2) rule for n=1.`},{id:70,category:`Periodic Table`,difficulty:`Medium`,question:`Which element has the highest electronegativity value in the periodic table?`,options:[`Oxygen`,`Fluorine`,`Chlorine`,`Nitrogen`],answerIndex:1,explanation:`Fluorine (F) is the most electronegative element in the periodic table, with a value of 4.0 on the Pauling scale, due to its small size and high effective nuclear charge which strongly attracts shared bonding electrons.`},{id:71,category:`General Chemistry`,difficulty:`Easy`,question:`What is the official SI unit for measuring the amount of substance in chemistry?`,options:[`Gram`,`Liter`,`Mole`,`Pascal`],answerIndex:2,explanation:`The mole (mol) is the SI base unit representing the amount of substance. One mole contains exactly 6.02214076 x 10^23 elementary entities.`},{id:72,category:`Atomic Structure`,difficulty:`Medium`,question:`What subatomic particles are located within the dense nucleus of a typical atom?`,options:[`Protons and Electrons`,`Electrons and Neutrons`,`Protons and Neutrons`,`Only Protons`],answerIndex:2,explanation:`The nucleus of an atom contains protons (positively charged) and neutrons (electrically neutral). Electrons orbit around this central nucleus in energy shells.`},{id:73,category:`Chemical Bonding`,difficulty:`Hard`,question:`Which of the following molecules has a linear molecular geometry?`,options:[`Water (H₂O)`,`Sulfur Dioxide (SO₂)`,`Carbon Dioxide (CO₂)`,`Ammonia (NH₃)`],answerIndex:2,explanation:`Carbon dioxide (CO₂) is linear (180° bond angle) because the central Carbon has two double bonds and no lone pairs, meaning its valence electron pairs repel each other to opposite sides.`},{id:74,category:`Acids & Bases`,difficulty:`Medium`,question:`Which pH value represents a strongly basic (alkaline) aqueous solution?`,options:[`1.0`,`5.0`,`7.0`,`13.0`],answerIndex:3,explanation:`The pH scale ranges from 0 to 14. A pH of 7.0 is neutral, values below 7 are acidic, and values above 7 are basic. A pH of 13.0 represents an extremely high concentration of hydroxide ions, making it strongly basic.`},{id:75,category:`General Chemistry`,difficulty:`Easy`,question:`Which state of matter possesses a definite volume but adapts to assume the shape of its container?`,options:[`Solid`,`Liquid`,`Gas`,`Plasma`],answerIndex:1,explanation:`Liquids have a definite volume because their constituent molecules are in close contact, but they can flow and take the shape of their container because the molecules can slide past one another.`},{id:76,category:`Lab Safety`,difficulty:`Medium`,question:`Which piece of laboratory equipment should be utilized to measure and dispense exact small volumes of liquid reactants?`,options:[`A graduated cylinder`,`A pipette or dropper`,`A beaker`,`Pouring directly from the stock bottle`],answerIndex:1,explanation:`A pipette (graduated or volumetric) or micro-pipette is designed to measure and transfer highly accurate small volumes of liquids, whereas beakers and flasks are only for holding and mixing reagents.`},{id:77,category:`Chemical Reactions`,difficulty:`Hard`,question:`According to Le Chatelier's Principle, how does increasing the external pressure affect the equilibrium of: N₂(g) + 3H₂(g) ⇌ 2NH₃(g)?`,options:[`Shift equilibrium to the left`,`Shift equilibrium to the right`,`No effect on the equilibrium`,`The reaction will stop`],answerIndex:1,explanation:`Increasing pressure shifts equilibrium toward the side with fewer gas moles. Here, the reactants side has 4 moles (1 N₂ + 3 H₂) and the products side has 2 moles (2 NH₃). Thus, the equilibrium shifts to the right.`},{id:78,category:`Periodic Table`,difficulty:`Medium`,question:`Which group in the periodic table represents the alkaline earth metals?`,options:[`Group 1`,`Group 2`,`Group 16`,`Group 17`],answerIndex:1,explanation:`Group 2 elements (Beryllium, Magnesium, Calcium, Strontium, Barium, Radium) are called the alkaline earth metals. They have two valence electrons.`},{id:79,category:`General Chemistry`,difficulty:`Easy`,question:`What is the correct chemical formula for common table salt?`,options:[`NaHCO₃`,`NaCl`,`NaOH`,`HCl`],answerIndex:1,explanation:`Table salt is Sodium Chloride, an ionic compound formed from sodium cations (Na+) and chloride anions (Cl-), represented by the empirical formula NaCl.`},{id:80,category:`Chemical Bonding`,difficulty:`Medium`,question:`Which type of chemical bond is characterized by the sharing of valence electron pairs between atoms?`,options:[`Ionic Bond`,`Covalent Bond`,`Metallic Bond`,`Hydrogen Bond`],answerIndex:1,explanation:`Covalent bonds form when nonmetal atoms share valence electrons to establish a stable, closed-valence shell configuration (octet).`},{id:81,category:`Atomic Structure`,difficulty:`Hard`,question:`Which of the following electron configurations corresponds to a transition metal atom in its ground state?`,options:[`[Ar] 4s²`,`[Ne] 3s² 3p⁵`,`[Ar] 3d⁵ 4s¹`,`[Xe] 6s¹`],answerIndex:2,explanation:`[Ar] 3d⁵ 4s¹ is the electron configuration of Chromium (Cr), a d-block transition metal. The configuration is stable due to the half-filled d-subshell.`},{id:82,category:`Acids & Bases`,difficulty:`Hard`,question:`What conjugate base is formed when sulfuric acid (H₂SO₄) donates a single proton?`,options:[`SO₄(2-)`,`HSO₄(-)`,`H₃SO₄(+)`,`SO₃(2-)`],answerIndex:1,explanation:`A conjugate base is formed by removing one H+ from an acid. Removing a single proton (H+) from H₂SO₄ yields the hydrogen sulfate ion (HSO₄-).`},{id:83,category:`General Chemistry`,difficulty:`Easy`,question:`What is the primary gaseous product released during biological photosynthesis?`,options:[`Carbon Dioxide`,`Nitrogen`,`Oxygen`,`Water Vapor`],answerIndex:2,explanation:`During photosynthesis, plants convert carbon dioxide and water into glucose and release Oxygen gas (O₂) as a byproduct: 6CO₂ + 6H₂O -> C₆H₁₂O₆ + 6O₂.`},{id:84,category:`Gases & Solutions`,difficulty:`Medium`,question:`Which gas law states that at a constant pressure, the volume of a fixed mass of gas is directly proportional to its absolute temperature?`,options:[`Boyle's Law`,`Charles's Law`,`Avogadro's Law`,`Dalton's Law`],answerIndex:1,explanation:`Charles's Law states that V ∝ T at constant pressure, which means V₁/T₁ = V₂/T₂ when temperature is measured on the absolute Kelvin scale.`},{id:85,category:`Organic Chemistry`,difficulty:`Hard`,question:`What is the characteristic functional group found in all organic alcohols?`,options:[`Carbonyl (-CO-)`,`Carboxyl (-COOH)`,`Hydroxyl (-OH)`,`Amino (-NH2)`],answerIndex:2,explanation:`Alcohols contain the Hydroxyl (-OH) functional group covalently bonded to a saturated carbon atom (e.g., Ethanol, CH₃CH₂OH).`},{id:86,category:`Lab Safety`,difficulty:`Easy`,question:`Why is it strictly forbidden to consume food or beverages inside a chemistry laboratory?`,options:[`Food might spoil quickly`,`Accidental ingestion of toxic chemical residues can occur`,`Lab reagents could make the food taste bad`,`It is distracting to other students`],answerIndex:1,explanation:`Eating or drinking in the lab creates a major safety risk of consuming chemical dust, vapors, or spill residues that might contaminate the food or hands.`},{id:87,category:`Chemical Reactions`,difficulty:`Hard`,question:`In a redox reaction, what chemical event does reduction represent?`,options:[`Loss of protons`,`Gain of protons`,`Loss of electrons`,`Gain of electrons`],answerIndex:3,explanation:`According to the OIL RIG mnemonic: Oxidation Is Loss, Reduction Is Gain. Reduction represents the gain of electrons by a chemical species, lowering its oxidation state.`},{id:88,category:`Periodic Table`,difficulty:`Medium`,question:`Which of the following elements is classified as a metalloid (exhibiting both metallic and nonmetallic properties)?`,options:[`Sodium`,`Silicon`,`Sulfur`,`Iron`],answerIndex:1,explanation:`Silicon (Si) is a classic metalloid. It forms a covalent network lattice like nonmetals but behaves as a semiconductor, allowing electrical conductivity under certain conditions like metals.`},{id:89,category:`Gases & Solutions`,difficulty:`Hard`,question:`What is the molarity (M) of a solution prepared by dissolving 2.0 moles of solute in enough water to yield 4.0 liters of final solution?`,options:[`0.5 M`,`2.0 M`,`4.0 M`,`8.0 M`],answerIndex:0,explanation:`Molarity (M) is moles of solute per liter of solution. M = 2.0 moles / 4.0 liters = 0.5 M (mol/L).`},{id:90,category:`Chemical Bonding`,difficulty:`Medium`,question:`How many single covalent bonds are present in a single molecule of methane (CH₄)?`,options:[`1`,`2`,`3`,`4`],answerIndex:3,explanation:`Methane consists of a central Carbon atom forming 4 separate single covalent bonds with 4 individual Hydrogen atoms (tetrahedral structure).`},{id:91,category:`General Chemistry`,difficulty:`Easy`,question:`What is the molecular formula of water?`,options:[`HO2`,`H2O`,`H2O2`,`H3O`],answerIndex:1,explanation:`Water consists of 2 Hydrogen atoms covalently bonded to 1 Oxygen atom, yielding the molecular formula H₂O.`},{id:92,category:`Organic Chemistry`,difficulty:`Hard`,question:`Which of the following represents the general formula for acyclic alkanes?`,options:[`CnH2n`,`CnH2n+2`,`CnH2n-2`,`CnHn`],answerIndex:1,explanation:`Saturated open-chain hydrocarbons (alkanes) follow the general formula C_n H_{2n+2}, where n is the number of Carbon atoms (e.g. Propane is C₃H₈).`},{id:93,category:`Atomic Structure`,difficulty:`Medium`,question:`Which scientist discovered the electron in 1897 using cathode ray tube experiments?`,options:[`Ernest Rutherford`,`John Dalton`,`J.J. Thomson`,`Niels Bohr`],answerIndex:2,explanation:`J.J. Thomson showed that cathode rays were composed of previously unknown negatively charged particles, which were later named electrons. He proposed the 'plum pudding' model of the atom.`},{id:94,category:`Acids & Bases`,difficulty:`Hard`,question:`Which of the following substances behaves as a weak acid in aqueous solution?`,options:[`Hydrochloric Acid (HCl)`,`Nitric Acid (HNO3)`,`Acetic Acid (CH3COOH)`,`Sulfuric Acid (H2SO4)`],answerIndex:2,explanation:`Acetic Acid (CH₃COOH) is a weak organic acid that only partially dissociates in water, whereas HCl, HNO₃, and H₂SO₄ are mineral acids that dissociate 100%.`},{id:95,category:`Lab Safety`,difficulty:`Easy`,question:`What should you immediately do if a concentrated chemical spill occurs on your skin in the lab?`,options:[`A paper towel`,`Plenty of running water`,`A neutralizing acid or base`,`Soap and hand sanitizer only`],answerIndex:1,explanation:`For chemical spills on the skin, immediately flush the area with massive amounts of running water under a safety shower or tap for at least 15 minutes. Do not attempt to neutralize it with other chemicals, as neutralization reactions release heat and cause further damage.`},{id:96,category:`Chemical Reactions`,difficulty:`Hard`,question:`What is the term for a substance that increases the rate of a chemical reaction without undergoing any permanent chemical change itself?`,options:[`Reactant`,`Product`,`Catalyst`,`Inhibitor`],answerIndex:2,explanation:`A catalyst speeds up reactions by offering an alternative pathway with lower activation energy, and it is fully recovered unchanged at the end of the reaction.`},{id:97,category:`Periodic Table`,difficulty:`Medium`,question:`What trend is observed in the atomic radius of elements as you move from left to right across a single period?`,options:[`It increases`,`It decreases`,`It remains the same`,`It increases then decreases`],answerIndex:1,explanation:`Moving left to right across a period, the atomic number (number of protons) increases, increasing the effective nuclear charge. This pulls the valence electron cloud closer to the nucleus, causing atomic radius to decrease.`},{id:98,category:`Gases & Solutions`,difficulty:`Hard`,question:`Which gas law states that the total pressure of a mixture of non-reacting gases is equal to the sum of their individual partial pressures?`,options:[`Ideal Gas Law`,`Boyle's Law`,`Dalton's Law of Partial Pressures`,`Charles's Law`],answerIndex:2,explanation:`Dalton's Law of Partial Pressures states that P_total = P₁ + P₂ + P₃ + ... for a mixture of ideal, non-reacting gases in a shared volume.`},{id:99,category:`General Chemistry`,difficulty:`Easy`,question:`What color does blue litmus paper turn when exposed to an acidic solution (pH < 7)?`,options:[`Blue`,`Green`,`Red`,`Yellow`],answerIndex:2,explanation:`Acidic solutions protonate the blue litmus dye conjugate base, causing it to change structure and turn red.`},{id:100,category:`Chemical Bonding`,difficulty:`Hard`,question:`Which of the following molecules contains a carbon-carbon triple bond ($C\\equiv C$)?`,options:[`Ethane (C2H6)`,`Ethene (C2H4)`,`Ethyne (C2H2)`,`Propane (C3H8)`],answerIndex:2,explanation:`Ethyne (also known as acetylene, C₂H₂) is an alkyne with a triple bond sharing 3 pairs of electrons between the two Carbon atoms: H-C≡C-H.`}];function Zr(){lt();let[e,t]=(0,x.useState)(`menu`),[n,r]=(0,x.useState)(10),[i,a]=(0,x.useState)([]),[o,s]=(0,x.useState)(0),[c,l]=(0,x.useState)(null),[u,d]=(0,x.useState)(!1),[f,p]=(0,x.useState)(0),[m,h]=(0,x.useState)(0),[g,_]=(0,x.useState)(0),[v,y]=(0,x.useState)(30),[b,S]=(0,x.useState)([]),C=e=>{r(e);let n=[...Xr].sort(()=>.5-Math.random());a(e===Xr.length?Xr:n.slice(0,e)),s(0),l(null),d(!1),p(0),h(0),_(0),y(30),S([]),t(`playing`)};(0,x.useEffect)(()=>{if(e!==`playing`||u)return;if(v===0){T(null,!0);return}let t=setTimeout(()=>{y(e=>e-1)},1e3);return()=>clearTimeout(t)},[v,e,u]);let w=e=>{u||l(e)},T=(e=null,t=!1)=>{if(u)return;let n=e===null?c:e,r=i[o],a=!t&&n===r.answerIndex;a?(p(e=>e+1),h(e=>{let t=e+1;return t>g&&_(t),t})):h(0),S(e=>[...e,{questionId **ChemLab Interactive** is an educational chemistry web application designed for high-school students. It features:
1. **Explore Page**: Interactive periodic table where you can view 3D test tubes and detailed atomic properties of elements.
2. **Virtual Lab Page**: A reaction bench where you can select elements, mix them in test tubes, and simulate chemical reactions.
3. **Classroom Page**: Curated video lectures covering core chemistry topics with summaries and formulas.
4. **Quiz Page**: A interactive test section with randomized questions, difficulty levels, and educational hints.`},{q:`How does the Virtual Lab work?`,a:`### 🔬 Virtual Lab Guide

To run a chemical reaction in the Virtual Lab:
1. Select a **Left Tube Element** using the dropdown selector on the left.
2. Select a **Right Tube Element** using the dropdown selector on the right.
3. Press the **Combine & React** button to pour both elements into the central beaker.
4. Observe the animation, thermodynamic properties, color changes, and read the reaction description.
5. Press **Reset Lab Bench** to try a new combination!`},{q:`How do I take a quiz?`,a:`### 📝 Quiz Mode Guide

1. Navigate to the **Quiz** section in the navigation header.
2. Choose your preferred **Difficulty Level** (Easy, Medium, Hard).
3. Read the question and choose one of the multiple-choice options.
4. Submit your answer to see if it is correct along with a detailed explanation.
5. If you get stuck, check the Classroom videos and formulas to review key concepts!`},{q:`What is an atom?`,a:`### ⚛️ Atomic Structure

An **atom** is the basic unit of a chemical element. It consists of a dense central **nucleus** surrounded by a cloud of negatively charged **electrons**.
- **Protons**: Positively charged particles in the nucleus. The number of protons defines the element's atomic number.
- **Neutrons**: Neutral particles in the nucleus that add mass and stability.
- **Electrons**: Negatively charged particles that orbit the nucleus in specific energy levels or shells.`},{q:`What is an isotope?`,a:`### 🧬 Isotopes

**Isotopes** are variants of a particular chemical element that have the **same number of protons** (same atomic number) but **different numbers of neutrons** (different mass numbers).
- Example: Carbon-12 ($^{12}\\text{C}$, 6 protons, 6 neutrons) vs. Carbon-14 ($^{14}\\text{C}$, 6 protons, 8 neutrons).
- Isotopes of an element share identical chemical properties but can have different physical and nuclear stability (some are radioactive).`},{q:`What is an ionic bond?`,a:`### 🤝 Ionic Bonding

An **ionic bond** is formed when one or more electrons are **transferred** from a metal atom to a nonmetal atom, creating electrostatic attraction between the resulting ions.
- **Cation**: The metal atom loses electrons and becomes positively charged (e.g., $\\text{Na}^+$).
- **Anion**: The nonmetal atom gains electrons and becomes negatively charged (e.g., $\\text{Cl}^-$).
- **Structure**: They form rigid, crystalline 3D lattices with high melting points (e.g., table salt, $\\text{NaCl}$).`},{q:`What is a covalent bond?`,a:`### 🤝 Covalent Bonding

A **covalent bond** is formed when two nonmetal atoms **share** one or more pairs of valence electrons to achieve stable full valence shells.
- **Single Bond**: Shares 1 pair of electrons (e.g., $\\text{H-H}$).
- **Double Bond**: Shares 2 pairs of electrons (e.g., $\\text{O=O}$).
- **Triple Bond**: Shares 3 pairs of electrons (e.g., $\\text{N}\\equiv\\text{N}$).
- They form discrete molecules (like water, $\\text{H}_2\\text{O}$) and generally have lower melting points than ionic compounds.`},{q:`What is a metallic bond?`,a:`### 🔩 Metallic Bonding

**Metallic bonding** is the electrostatic attraction between conduction electrons (in the form of a 'sea' of delocalized electrons) and metallic cations.
- Delocalized electrons are free to move throughout the structure.
- This explains key metallic properties such as **high electrical conductivity**, **high thermal conductivity**, **malleability**, and **ductility**.`},{q:`What is electronegativity?`,a:`### 📈 Electronegativity

**Electronegativity** is a chemical property describing an atom's ability to attract shared electrons in a covalent bond.
- **Trend**: Electronegativity **increases across a period** (left to right) and **decreases down a group** (top to bottom).
- **Highest**: Fluorine ($\\text{F}$, value of 4.0) is the most electronegative element.
- **Lowest**: Francium ($\\text{Fr}$) is the least electronegative element.`},{q:`What is ionization energy?`,a:`### ⚡ Ionization Energy

**Ionization energy** is the minimum energy required to remove the most loosely bound electron from an isolated gaseous atom.
- **Trend**: Ionization energy **increases across a period** (as nuclear charge increases, holding electrons tighter) and **decreases down a group** (as outer electrons are shielded and further from the nucleus).`},{q:`What is atomic radius?`,a:`### 📏 Atomic Radius

**Atomic radius** represents the distance from the center of an atom's nucleus to its outermost electron shell.
- **Trend**: Atomic radius **decreases across a period** (left to right) due to increasing nuclear charge pulling electrons closer.
- **Trend**: Atomic radius **increases down a group** (top to bottom) as new electron shells are added.`},{q:`What is the mole?`,a:`### ⚖️ The Mole & Avogadro's Number

In chemistry, the **mole** (mol) is the standard unit of measurement for amount of substance.
- One mole contains exactly **$6.022 \\times 10^{23}$** particles (atoms, molecules, or ions). This number is called **Avogadro's Number** ($N_A$).
- The mass of one mole of a substance is its **molar mass**, which corresponds to its atomic or molecular weight in grams per mole (g/mol).`},{q:`What is stoichiometry?`,a:`### 🧮 Stoichiometry

**Stoichiometry** is the calculation of quantitative relationships of the reactants and products in a balanced chemical reaction.
- It uses the coefficients from balanced chemical equations to establish mole ratios between substances.
- Steps: Convert given units to moles $\\rightarrow$ Use mole ratio from the balanced equation $\\rightarrow$ Convert moles to desired units.`},{q:`What is a limiting reactant?`,a:`### ⚠️ Limiting Reactant

The **limiting reactant** (or limiting reagent) is the substance that is completely consumed first in a chemical reaction, thereby limiting the amount of product that can be formed.
- **Excess Reactant**: The reactant that is left over after the limiting reactant is completely used up.
- To find the limiting reactant: Calculate the moles of product that can be formed from each reactant; the one yielding the least product is limiting.`},{q:`What is Boyle's Law?`,a:`### 🎈 Boyle's Law

**Boyle's Law** states that the pressure ($P$) of a given mass of gas is inversely proportional to its volume ($V$) at a constant temperature.
- **Formula**: $$P_1V_1 = P_2V_2$$
- If volume decreases, pressure increases because gas particles collide more frequently with the walls of the container.`},{q:`What is Charles's Law?`,a:`### 🔥 Charles's Law

**Charles's Law** states that the volume ($V$) of a given mass of gas is directly proportional to its absolute temperature ($T$ in Kelvin) at a constant pressure.
- **Formula**: $$\\frac{V_1}{T_1} = \\frac{V_2}{T_2}$$
- If temperature increases, gas particles move faster and push outward, expanding the volume if pressure remains constant.`},{q:`What is Avogadro's Law?`,a:`### 💨 Avogadro's Law

**Avogadro's Law** states that the volume ($V$) of a gas is directly proportional to the number of moles ($n$) of the gas at constant temperature and pressure.
- **Formula**: $$\\frac{V_1}{n_1} = \\frac{V_2}{n_2}$$
- Equal volumes of gases at the same temperature and pressure contain an equal number of molecules.`},{q:`What is the Ideal Gas Law?`,a:`### 🌪️ Ideal Gas Law

The **Ideal Gas Law** describes the state of a hypothetical ideal gas, combining Boyle's, Charles's, and Avogadro's laws.
- **Formula**: $$PV = nRT$$
- $P$ = pressure, $V$ = volume, $n$ = moles of gas, $R$ = ideal gas constant (usually $0.0821\\text{ L}\\cdot\\text{atm}/\\text{mol}\\cdot\\text{K}$), $T$ = temperature in Kelvin.`},{q:`What is molarity?`,a:`### 💧 Solution Molarity

**Molarity** ($M$) is a measure of the concentration of a solute in a solution, defined as the number of moles of solute per liter of solution.
- **Formula**: $$M = \\frac{\\text{moles of solute}}{\\text{liters of solution}}$$
- Example: A 1.0 M solution contains 1.0 mole of solute dissolved in a final volume of 1.0 liter of solution.`},{q:`What is solubility?`,a:`### 🧊 Solubility & Saturation

**Solubility** is the maximum amount of a solute that can dissolve in a given amount of solvent at a specific temperature.
- **Saturated Solution**: Contains the maximum amount of dissolved solute. Any additional solute will not dissolve and will settle at the bottom.
- **Unsaturated Solution**: Contains less than the maximum amount of solute. More solute can still dissolve.
- **Supersaturated Solution**: Contains more solute than is normally possible at that temperature (highly unstable, formed by heating and slow cooling).`},{q:`What is an Arrhenius acid and base?`,a:`### 🧪 Arrhenius Acids & Bases

Defined by Svante Arrhenius in 1884:
- **Arrhenius Acid**: A substance that increases the concentration of hydrogen ions ($\\text{H}^+$) when dissolved in water (e.g., $\\text{HCl}$). 
  $$\\text{HCl (aq)} \\rightarrow \\text{H}^+\\text{ (aq)} + \\text{Cl}^-\\text{ (aq)}$$
- **Arrhenius Base**: A substance that increases the concentration of hydroxide ions ($\\text{OH}^-$) when dissolved in water (e.g., $\\text{NaOH}$).
  $$\\text{NaOH (aq)} \\rightarrow \\text{Na}^+\\text{ (aq)} + \\text{OH}^-\\text{ (aq)}$$`},{q:`What is a Bronsted-Lowry acid and base?`,a:`### 🧪 Brønsted-Lowry Acids & Bases

Defined independently by Johannes Brønsted and Thomas Lowry in 1923:
- **Acid**: A **proton ($\\text{H}^+$) donor**.
- **Base**: A **proton ($\\text{H}^+$) acceptor**.
- Example: In $\\text{NH}_3 + \\text{H}_2\\text{O} \\rightleftharpoons \\text{NH}_4^+ + \\text{OH}^-$, water acts as an acid (donates $\\text{H}^+$) and ammonia acts as a base (accepts $\\text{H}^+$).`},{q:`What is the pH scale?`,a:`### 📈 The pH Scale

**pH** is a logarithmic scale measuring the acidity or basicity of an aqueous solution, calculated as:
$$\\text{pH} = -\\log[\\text{H}^+]$$
- **pH < 7**: Acidic solution (excess of $\\text{H}^+$ ions).
- **pH = 7**: Neutral solution (water, where $[\\text{H}^+] = [\\text{OH}^-] = 1.0 \\times 10^{-7}\\text{ M}$).
- **pH > 7**: Basic (alkaline) solution (excess of $\\text{OH}^-$ ions).`},{q:`What is neutralization?`,a:`### 💥 Neutralization Reactions

A **neutralization reaction** occurs when an acid and a base react to form water and a salt.
- **General Word Equation**: $$\\text{Acid} + \\text{Base} \\rightarrow \\text{Salt} + \\text{Water}$$
- Example: Hydrochloric acid + Sodium hydroxide:
  $$\\text{HCl (aq)} + \\text{NaOH (aq)} \\rightarrow \\text{NaCl (aq)} + \\text{H}_2\\text{O (l)}$$
- Net Ionic Equation:
  $$\\text{H}^+\\text{ (aq)} + \\text{OH}^-\\text{ (aq)} \\rightarrow \\text{H}_2\\text{O (l)}$$`},{q:`What is acid-base titration?`,a:`### 🧪 Acid-Base Titration

A **titration** is a laboratory technique used to determine the unknown concentration of an acidic or basic solution by reacting it with a solution of known concentration (the standard solution/titrant).
- **Equivalence Point**: The point at which the moles of acid exactly equal the moles of base needed for complete neutralization.
- **Endpoint**: The point at which a chemical indicator changes color, signaling that the titration is complete.`},{q:`What is Le Chatelier's Principle?`,a:`### ⚖️ Le Chatelier's Principle

**Le Chatelier's Principle** states that if a dynamic equilibrium system is subjected to a change in concentration, temperature, or pressure, the system will shift its equilibrium position to counteract the effect of the change.
- **Adding Reactants**: Shifts equilibrium to the right (products side).
- **Increasing Temperature (Exothermic)**: Shifts equilibrium to the left (reactants side).
- **Increasing Pressure**: Shifts equilibrium to the side with fewer gas moles.`},{q:`What is Gibbs Free Energy?`,a:`### 🌀 Gibbs Free Energy ($G$)

**Gibbs Free Energy** combines enthalpy and entropy to determine if a chemical reaction will occur spontaneously.
- **Formula**: $$\\Delta G = \\Delta H - T\\Delta S$$
- **$\\Delta G < 0$**: The reaction is **spontaneous** (exergonic).
- **$\\Delta G = 0$**: The reaction is at **equilibrium**.
- **$\\Delta G > 0$**: The reaction is **non-spontaneous** (endergonic, requires energy).`},{q:`What are oxidation and reduction?`,a:`### ⚡ Redox Reactions (Oxidation & Reduction)

A **Redox reaction** involves the transfer of electrons between chemical species. You can remember this using the acronym **OIL RIG**:
- **Oxidation Is Loss** of electrons. The oxidation number increases.
- **Reduction Is Gain** of electrons. The oxidation number decreases.
- Example: In $$\\text{Zn} + \\text{Cu}^{2+} \\rightarrow \\text{Zn}^{2+} + \\text{Cu}$$
  Zinc is oxidized (loses electrons), and copper ion is reduced (gains electrons).`},{q:`What is organic chemistry?`,a:`### 🌿 Introduction to Organic Chemistry

**Organic Chemistry** is the study of the structure, properties, composition, reactions, and preparation of carbon-containing compounds.
- Carbon is unique because it has 4 valence electrons and can form stable covalent single, double, and triple bonds with itself and other elements (hydrogen, oxygen, nitrogen, halogens).
- The simplest organic compounds are **hydrocarbons** (containing only carbon and hydrogen), divided into alkanes, alkenes, and alkynes.`},{q:`What are alkanes, alkenes, and alkynes?`,a:`### ⛽ Hydrocarbons classification

- **Alkanes**: Hydrocarbons containing only **single bonds** (saturated). Formula: $\\text{C}_n\\text{H}_{2n+2}$ (e.g., Methane $\\text{CH}_4$, Propane $\\text{C}_3\\text{H}_8$).
- **Alkenes**: Hydrocarbons containing at least one **carbon-carbon double bond** (unsaturated). Formula: $\\text{C}_n\\text{H}_{2n}$ (e.g., Ethene $\\text{C}_2\\text{H}_4$).
- **Alkynes**: Hydrocarbons containing at least one **carbon-carbon triple bond** (unsaturated). Formula: $\\text{C}_n\\text{H}_{2n-2}$ (e.g., Ethyne $\\text{C}_2\\text{H}_2$).`},{q:`What is endothermic and exothermic?`,a:`### 🔥 Thermodynamics: Enthalpy Changes

- **Exothermic Reaction**: Releases heat to the surroundings ($$\\Delta H < 0$$). The temperature of the surroundings rises. (e.g., combustion of methane).
- **Endothermic Reaction**: Absorbs heat from the surroundings ($$\\Delta H > 0$$). The temperature of the surroundings drops. (e.g., dissolving ammonium chloride in water).`},{q:`What is reaction rate?`,a:`### ⏱️ Chemical Kinetics & Reaction Rate

**Reaction rate** is the speed at which reactants are converted into products.
- Factors affecting reaction rate:
  1. **Concentration**: More particles lead to more frequent collisions.
  2. **Temperature**: Higher temperature increases particle kinetic energy, leading to more energetic collisions.
  3. **Surface Area**: Finely divided solids expose more surface area for collisions.
  4. **Catalysts**: Speed up reactions by providing an alternative pathway with lower activation energy.`},{q:`What is a catalyst?`,a:`### ⚡ Catalysts

A **catalyst** is a substance that increases the rate of a chemical reaction without undergoing any permanent chemical change itself.
- It works by lowering the **activation energy** ($E_a$) required for the reaction to proceed.
- Catalysts do *not* affect the chemical equilibrium position or the overall change in enthalpy ($\\Delta H$) of the reaction.`},{q:`What is a single displacement reaction?`,a:`### 💥 Single Displacement Reactions

A **single displacement reaction** occurs when a more active free element replaces a less active element in a compound.
- **General Form**: $$\\text{A} + \\text{BC} \\rightarrow \\text{AC} + \\text{B}$$
- Example: Zinc reacting with copper sulfate:
  $$\\text{Zn (s)} + \\text{CuSO}_4\\text{ (aq)} \\rightarrow \\text{ZnSO}_4\\text{ (aq)} + \\text{Cu (s)}$$
- This only occurs if metal A is higher on the **Activity Series** than metal B.`},{q:`What is a double displacement reaction?`,a:`### 💥 Double Displacement Reactions

A **double displacement reaction** (or metathesis) occurs when the cations and anions of two ionic compounds switch places, often forming a precipitate, gas, or water.
- **General Form**: $$\\text{AB} + \\text{CD} \\rightarrow \\text{AD} + \\text{CB}$$
- Example: Silver nitrate and sodium chloride forming a white silver chloride precipitate:
  $$\\text{AgNO}_3\\text{ (aq)} + \\text{NaCl (aq)} \\rightarrow \\text{AgCl (s)} \\downarrow + \\text{NaNO}_3\\text{ (aq)}$$`},{q:`What is a synthesis reaction?`,a:`### 🧪 Synthesis (Combination) Reactions

A **synthesis reaction** occurs when two or more simple reactants combine to form a single, more complex product.
- **General Form**: $$\\text{A} + \\text{B} \\rightarrow \\text{AB}$$
- Example: The formation of water from hydrogen and oxygen gas:
  $$\\text{2H}_2\\text{ (g)} + \\text{O}_2\\text{ (g)} \\rightarrow \\text{2H}_2\\text{O (l)}$$`},{q:`What is a decomposition reaction?`,a:`### 🧪 Decomposition Reactions

A **decomposition reaction** occurs when a single complex reactant breaks down into two or more simpler products.
- **General Form**: $$\\text{AB} \\rightarrow \\text{A} + \\text{B}$$
- Example: Heating calcium carbonate to yield calcium oxide and carbon dioxide:
  $$\\text{CaCO}_3\\text{ (s)} \\xrightarrow{\\Delta} \\text{CaO (s)} + \\text{CO}_2\\text{ (g)}$$`},{q:`What is a combustion reaction?`,a:`### 🔥 Combustion Reactions

A **combustion reaction** occurs when a substance (usually a hydrocarbon fuel) reacts rapidly with oxygen gas ($\\text{O}_2$), releasing significant heat and light (exothermic) and producing oxides.
- **General Form (Hydrocarbon)**: $$\\text{C}_x\\text{H}_y + \\text{O}_2 \\rightarrow \\text{CO}_2 + \\text{H}_2\\text{O}$$
- Example: Burning propane gas:
  $$\\text{C}_3\\text{H}_8\\text{ (g)} + \\text{5O}_2\\text{ (g)} \\rightarrow \\text{3CO}_2\\text{ (g)} + \\text{4H}_2\\text{O (g)}$$`},{q:`What is the conservation of mass?`,a:`### ⚖️ Law of Conservation of Mass

The **Law of Conservation of Mass** states that mass is neither created nor destroyed in a chemical reaction.
- The total mass of the reactants must equal the total mass of the products.
- In equations: The number of atoms of each element on the reactant side (left) must equal the number of atoms of those same elements on the product side (right). This is why chemical equations must be balanced!`},{q:`What are valence electrons?`,a:`### 🌟 Valence Electrons

**Valence electrons** are the electrons located in the outermost occupied electron shell of an atom.
- They determine an element's chemical properties and chemical reactivity, as they participate in chemical bonding.
- Group 1 elements (Alkali metals) have 1 valence electron, while Group 18 (Noble gases) have 8 valence electrons (a full octet, making them chemically inert).`},{q:`What is the octet rule?`,a:`### 🌟 The Octet Rule

The **octet rule** is a chemical rule of thumb stating that atoms tend to bind, share, or transfer electrons in a way that gives them **eight valence electrons** in their outer shell, matching the stable electron configuration of a noble gas.`},{q:`What is a mixture?`,a:`### 🧪 Mixtures: Homogeneous vs Heterogeneous

A **mixture** is a physical combination of two or more substances that are not chemically bonded.
- **Homogeneous Mixture**: Has a uniform composition throughout. Individual components are not visible (e.g., saltwater, air, brass alloy). Also called a **solution**.
- **Heterogeneous Mixture**: Has a non-uniform composition. You can see the separate phases or components (e.g., sand in water, oil and vinegar, chocolate chip cookies).`},{q:`What is the difference between a compound and a mixture?`,a:`### 🧪 Compound vs Mixture

| Feature | Compound | Mixture |
| :--- | :--- | :--- |
| **Bonding** | Chemically bonded | Physically combined |
| **Composition** | Definite, fixed proportions (e.g. $H_2O$) | Variable proportions |
| **Separation** | Only by chemical reactions | Physical methods (filtering, distillation) |
| **Properties** | Completely different from parent elements | Retains properties of its components |`},{q:`What is physical vs chemical change?`,a:`### 🔄 Physical vs Chemical Change

- **Physical Change**: Alters the form or appearance of a substance, but does **not** create a new substance. (e.g. melting ice, boiling water, cutting paper, dissolving sugar).
- **Chemical Change**: A chemical reaction occurs, forming **new substances** with different properties. Indicators include gas production (bubbles), temperature changes, color changes, or precipitate formation (e.g. rusting iron, burning wood, vinegar and baking soda reaction).`},{q:`What is a precipitate?`,a:`### 🌨️ Precipitates & Precipitation

A **precipitate** is an insoluble solid that forms and settles out of a liquid solution during a chemical reaction.
- This occurs when two soluble ionic solutions are mixed and form an insoluble combination of ions, exceeding the solubility limit ($K_{sp}$).
- In equations, it is often denoted with an arrow pointing down ($\\downarrow$) or a solid phase marker ($\\text{(s)}$).`},{q:`What is a noble gas?`,a:`### 💤 Noble Gases

**Noble gases** are the elements in Group 18 of the periodic table (Helium, Neon, Argon, Krypton, Xenon, Radon).
- They are characterized by having a **completely filled valence electron shell** ($s^2p^6$, except Helium which has $1s^2$).
- Because they have a full octet, they are extremely stable and chemically inert, rarely reacting with other elements.`},{q:`What are alkali metals?`,a:`### 💥 Alkali Metals

**Alkali metals** are the elements in Group 1 of the periodic table (Lithium, Sodium, Potassium, Rubidium, Cesium, Francium, excluding Hydrogen).
- They have **1 valence electron** which they lose very easily to form $+1$ cations.
- They are soft, highly reactive metals that react violently with water to form alkaline hydroxides and hydrogen gas, releasing heat.`},{q:`What are alkaline earth metals?`,a:`### 💥 Alkaline Earth Metals

**Alkaline earth metals** are the elements in Group 2 of the periodic table (Beryllium, Magnesium, Calcium, Strontium, Barium, Radium).
- They have **2 valence electrons** which they lose to form $+2$ cations.
- They are shiny, silver-white reactive metals, though less reactive than the alkali metals in Group 1.`},{q:`What are halogens?`,a:`### ⚡ Halogens

**Halogens** are the elements in Group 17 of the periodic table (Fluorine, Chlorine, Bromine, Iodine, Astatine).
- They have **7 valence electrons** and are highly reactive nonmetals that need to gain 1 electron to achieve a full octet.
- They form salts when reacted with metals (e.g., sodium chloride $\\text{NaCl}$).`},{q:`What is organic nomenclature?`,a:`### 🔤 Organic Nomenclature IUPAC Rules

To name simple hydrocarbons:
1. Identify the **parent chain** (longest continuous carbon chain): 1=meth-, 2=eth-, 3=prop-, 4=but-, 5=pent-, 6=hex-, 7=hept-, 8=oct-, 9=non-, 10=dec-.
2. Identify bonds: All single bonds = **-ane**; One double bond = **-ene**; One triple bond = **-yne**.
3. Number the carbon chain starting from the end closest to a double/triple bond or substituent branch to give them the lowest possible number.`},{q:`Why is the bond angle of H2O less than NH3?`,a:`### 📐 H₂O vs NH₃ Bond Angle

Although both water ($
\\text{H}_2\\text{O}$) and ammonia ($
\\text{NH}_3$) have $sp^3$ hybridized central atoms with ideal tetrahedral geometry of $109.5^\\circ$, their actual bond angles are different:
- **Ammonia ($\\text{NH}_3$)**: Has **1 lone pair** on the Nitrogen atom. The lone pair-bond pair repulsion squeezes the $\\text{H-N-H}$ bond angle down to **$107^\\circ$**.
- **Water ($\\text{H}_2\\text{O}$)**: Has **2 lone pairs** on the Oxygen atom. According to VSEPR theory, lone pair-lone pair repulsion is stronger than lone pair-bond pair repulsion, squeezing the $\\text{H-O-H}$ bond angle even further down to **$104.5^\\circ$**.`},{q:`Why does Chlorine have a more negative electron gain enthalpy than Fluorine?`,a:`### ⚡ Electron Gain Enthalpy: Cl vs F

Normally, electron gain enthalpy becomes less negative down a group. However, **Chlorine ($
\\text{Cl}$)** has a more negative electron gain enthalpy than **Fluorine ($
\\text{F}$)**:
- Fluorine is extremely small (valence shell is $2p$). Adding an electron to this small volume causes **high electron-electron repulsion** among the existing electrons.
- Chlorine has a larger valence shell ($3p$). Adding an electron is much easier because the incoming electron experiences less repulsion from the electrons already present.`},{q:`Why does the acidity of halogen hydrides increase down the group?`,a:`### 🧪 Acidity Trend: HF to HI

The acidic strength of halogen hydrides increases in the order: **$\\text{HF} < \\text{HCl} < \\text{HBr} < \\text{HI}$**:
- **Bond Length**: Down the group, the size of the halogen atom increases (from $\\text{F}$ to $\\text{I}$), which increases the $\\text{H-X}$ bond length.
- **Bond Strength**: Longer bonds are weaker. The bond dissociation enthalpy decreases dramatically from $\\text{H-F}$ (very strong) to $\\text{H-I}$ (very weak).
- **Conclusion**: Despite fluorine being highly electronegative, $\\text{HI}$ easily dissociates in water to release $\\text{H}^+$ ions, making it the strongest acid in the group.`},{q:`Why is NH3 a stronger Lewis base than PH3?`,a:`### 🧪 Lewis Basicity: NH₃ vs PH₃

**Ammonia ($
\\text{NH}_3$)** is a stronger Lewis base than **phosphine ($
\\text{PH}_3$)**:
- **Size of Central Atom**: Nitrogen is much smaller than Phosphorus.
- **Electron Density**: Because of the smaller atomic size of Nitrogen, its lone pair of electrons is concentrated in a smaller volume, leading to high electron density.
- **Donor Ability**: The highly concentrated lone pair on Nitrogen is more easily donated to an electron-acceptor (Lewis acid) compared to the diffused lone pair on the larger Phosphorus atom in $\\text{PH}_3$.`},{q:`Can a reaction with a positive enthalpy change be spontaneous?`,a:`### 🌀 Spontaneous Endothermic Reactions

Yes, an endothermic reaction ($\\Delta H > 0$) can be spontaneous if the entropy change ($\\Delta S$) is positive and the temperature is high enough:
- According to the Gibbs Free Energy equation: $$\\Delta G = \\Delta H - T\\Delta S$$
- For spontaneity, we require $$\\Delta G < 0$$.
- If $$\\Delta H$$ is positive and $$\\Delta S$$ is positive, the term $$-T\\Delta S$$ is negative.
- At high temperatures, the magnitude of $$T\\Delta S$$ will exceed $$\\Delta H$$, making $$\\Delta G$$ negative. (e.g., evaporation of water, melting of ice, decomposition of calcium carbonate).`},{q:`What is the hybridization and geometry of XeF4?`,a:`### 🧪 Structure of XeF₄

**Xenon Tetrafluoride ($
\\text{XeF}_4$)** has a unique structure:
- **Valence Electrons**: Xenon has 8 valence electrons. Four form single bonds with Fluorine atoms, leaving 4 electrons (2 lone pairs).
- **Steric Number**: 4 bond pairs + 2 lone pairs = **6** (octahedral electron geometry).
- **Hybridization**: $sp^3d^2$ hybridized orbital system.
- **Molecular Geometry**: **Square Planar**. To minimize repulsion, the 2 lone pairs occupy opposite (trans) positions perpendicular to the plane of the fluorine atoms.`},{q:`How does a buffer solution resist pH changes?`,a:`### 🛡️ Buffer Action Mechanism

A buffer solution contains a weak acid and its conjugate base (or a weak base and its conjugate acid). It resists pH changes by neutralizing added acids or bases:
- **When Acid ($H^+$) is added**: The conjugate base (e.g., $\\text{CH}_3\\text{COO}^-$) reacts with the added $H^+$ to form weak, mostly unionized acid molecules:
  $$\\text{CH}_3\\text{COO}^- + \\text{H}^+ \\rightarrow \\text{CH}_3\\text{COOH}$$
- **When Base ($OH^-$) is added**: The weak acid (e.g., $\\text{CH}_3\\text{COOH}$) reacts with the added $OH^-$ to neutralize it and form water:
  $$\\text{CH}_3\\text{COOH} + \\text{OH}^- \\rightarrow \\text{CH}_3\\text{COO}^- + \\text{H}_2\\text{O}$$
- This maintains a stable ratio of weak acid to conjugate base, keeping the pH relatively constant.`},{q:`Why is Nitrogen gas inert at room temperature while Phosphorus is reactive?`,a:`### 💥 N₂ vs P₄ Reactivity

- **Nitrogen ($
\\text{N}_2$)**: Exists as a diatomic molecule with a **triple covalent bond** ($N\\equiv N$). The bond dissociation energy is extremely high ($945\\text{ kJ/mol}$), making it highly stable and inert under normal conditions.
- **Phosphorus ($
\\text{P}_4$)**: Exists as a tetraatomic tetrahedral molecule. The $\\text{P-P-P}$ bond angles are constrained to $60^\\circ$, causing **severe angular ring strain**. This makes the single covalent bonds unstable and highly reactive (white phosphorus catches fire spontaneously in air).`},{q:`What are Fajans' Rules for covalent character in ionic bonds?`,a:`### 🤝 Fajans' Rules

**Fajans' Rules** predict whether a chemical bond will be primarily ionic or covalent based on polarization:
1. **Small Cation**: Smaller cations have higher charge density and pull electron clouds from anions more strongly, increasing covalent character.
2. **Large Anion**: Larger anions have loosely bound outer electrons, making them easy to polarize.
3. **High Charge**: High positive charge on the cation or negative charge on the anion increases polarization.

No, a catalyst does **not** change the equilibrium constant ($K_{eq}$) or the equilibrium composition of a reaction:
- A catalyst speeds up a reaction by lowering the activation energy, which speeds up **both** the forward and reverse reactions by the exact same factor.
- It helps the system reach equilibrium **much faster**, but it does not shift the position of the equilibrium or change the final concentrations of reactants and products.`},{q:`Under what conditions do real gases behave most like ideal gases?`,a:`### 🎈 Ideal Behavior of Real Gases

A real gas behaves most like an ideal gas under **High Temperature** and **Low Pressure**:
- **Low Pressure**: Gas molecules are spaced very far apart, making their individual physical volumes negligible compared to the total volume of the container.
- **High Temperature**: Molecules have extremely high kinetic energy, meaning they move rapidly past one another. The brief collisions make intermolecular attractive forces between the molecules completely negligible.`},{q:`Why is Cesium preferred in photoelectric cells?`,a:`### ⚡ Cesium and Photoelectric Effect

**Cesium ($
\\text{Cs}$)** is highly favored in photoelectric cells due to its atomic properties:
- It is located at the bottom-left of the periodic table (Group 1, Period 6), giving it a **very large atomic radius**.
- The outermost valence electron is far from the nucleus and shielded, resulting in the **lowest ionization energy** among stable elements.
- This allows even low-energy incident light (like visible red light) to easily eject the valence electron and generate an electric current.`},{q:`Why is Oxygen gas paramagnetic?`,a:`### 🧲 Paramagnetism of O₂

According to Lewis theory, oxygen gas ($\\text{O}_2$) has a double bond with all paired electrons. However, experiments show it is **paramagnetic** (attracted to magnets):
- **Molecular Orbital (MO) Theory** explains this anomaly. In the MO diagram of $\\text{O}_2$, the final two valence electrons must be placed into the degenerate **anti-bonding $\\pi^*$ orbitals** ($2p_y^*$ and $2p_z^*$).
- According to Hund's Rule, these electrons enter separate orbitals with parallel spins, leaving **two unpaired electrons**, which causes its strong paramagnetic behavior.`},{q:`What does a negative standard reduction potential mean?`,a:`### ⚡ Negative Standard Reduction Potential

The standard reduction potential ($E^\\circ$) measures a species' tendency to gain electrons and be reduced relative to the Standard Hydrogen Electrode ($E^\\circ = 0.00\\text{ V}$):
- **Negative $E^\\circ$ Value**: Indicates that the species is **difficult to reduce** and highly prefers to lose electrons (be oxidized).
- **Chemical Reactivity**: Elements with very negative potentials (e.g., Lithium, Potassium, Sodium) are **powerful reducing agents** and react vigorously to donate electrons to other species.`},{q:`What is the common ion effect?`,a:`### 💧 Common Ion Effect

The **common ion effect** is the suppression of the ionization of a weak electrolyte or solubility of an ionic salt when a strong electrolyte containing a common ion is added to the solution:
- **Example**: If you add Sodium Chloride ($\\text{NaCl}$) to a saturated solution of Silver Chloride ($\\text{AgCl}$), the chloride ion concentration increases.
- **Le Chatelier Shift**: According to Le Chatelier's principle, the equilibrium shifts to the left, causing more $\\text{AgCl}$ to precipitate: $$\\text{AgCl (s)} \\rightleftharpoons \\text{Ag}^+\\text{ (aq)} + \\text{Cl}^-\\text{ (aq)}$$
- This results in a significant **decrease in the solubility** of $\\text{AgCl}$.`},{q:`Why does ice float on water?`,a:`### 🧊 Why Ice Floats

Unlike most substances where the solid phase is denser than the liquid phase, **solid ice is less dense than liquid water**:
- **Hydrogen Bonding**: In liquid water, molecules are dynamic and constantly forming/breaking hydrogen bonds, packing closely together.
- **Ice Crystal Lattice**: As water freezes ($< 0^\\circ\\text{C}$), the molecules slow down and form stable, hexagonal hydrogen-bonded crystalline structures.
- **Open Cage Structure**: This crystal lattice holds the molecules further apart in an open, cage-like structure, creating empty space and decreasing the density by about 9%.`},{q:`What is Huckel's Rule for aromaticity?`,a:`### 🌿 Hückel's Rule of Aromaticity

For a molecule to be classified as **aromatic** (exhibiting extreme thermodynamic stability and unique resonance), it must satisfy four key rules:
1. **Cyclic**: The molecule must contain a closed ring of atoms.
2. **Planar**: Every atom in the ring must be $sp^2$ or $sp$ hybridized, allowing the p-orbitals to align.
3. **Fully Conjugated**: Alternating single and double bonds (or lone pairs) around the entire ring.
4. **Hückel's Number**: The conjugated ring must contain exactly **$(4n + 2)$** delocalized $\\pi$ electrons (where $n$ is a non-negative integer: $0, 1, 2, \\dots$, resulting in $2, 6, 10, 14$ electrons).`},{q:`What is Markovnikov's Rule?`,a:`### 🌿 Markovnikov's Rule

**Markovnikov's Rule** is an organic chemistry rule used to predict the regiochemistry of electrophilic addition reactions to unsymmetrical alkenes:
- **Rule**: When adding a protic acid (like $\\text{HCl}$, $\\text{HBr}$, or $\\text{H}_2\\text{O}$) to an alkene, the acidic Hydrogen atom adds to the double-bonded carbon with the **greater number of hydrogen atoms**.
- **Explanation**: This addition route proceeds via the **most stable carbocation intermediate** (a tertiary carbocation is more stable than secondary, which is more stable than primary). The halide nucleophile then binds to this more substituted carbon.`},{q:`What is the difference between resonance and tautomerism?`,a:`### 🔄 Resonance vs Tautomerism

Although both represent different forms of a compound, they are fundamentally different chemical phenomena:
- **Resonance**: Involves only the **delocalization of electrons** (mainly $\\pi$ electrons and lone pairs). The positions of the atomic nuclei **never change**. Resonance hybrids are virtual structures, not separate chemical species at equilibrium.
